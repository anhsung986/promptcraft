<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptCraft AI - Tạo Web Tự Động</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0e14; color: #e6edf3; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }
        .bg-glow { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(255,0,127,0.15) 100%); filter: blur(80px); border-radius: 50%; z-index: 0; }
        .container { position: relative; z-index: 1; background: rgba(22, 27, 34, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 24px; padding: 40px; width: 100%; max-width: 520px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        h1 { text-align: center; color: #00f0ff; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
        p.subtitle { text-align: center; color: #8b949e; font-size: 14px; margin-bottom: 30px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 12px; color: #00f0ff; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; border-radius: 12px; background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.3); }
        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(45deg, #00f0ff, #ff007f); color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 25px rgba(0, 240, 255, 0.4); }
        .footer { text-align: center; margin-top: 25px; font-size: 12px; color: #8b949e; }
        .footer a { color: #00f0ff; text-decoration: none; }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
    <h1><i class="fa-solid fa-wand-magic-sparkles"></i> PromptCraft</h1>
    <p class="subtitle">Hệ thống khởi tạo Website tự động 100% bằng AI</p>

    <form id="buildForm" action="https://github.com/anhsung986/promptcraft/issues/new" method="GET" target="_blank">
        <div class="input-group">
            <label><i class="fa-solid fa-user"></i> 1. Dành cho ai</label>
            <input type="text" name="title" placeholder="VD: Người Yêu / Bạn Thân / Mẹ..." required>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-heading"></i> 2. Tên dự án / Tiêu đề</label>
            <input type="text" placeholder="VD: Kỷ Niệm Tình Yêu" required>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-calendar-days"></i> 3. Mốc thời gian kỷ niệm</label>
            <input type="text" placeholder="VD: 14/02/2027" required>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-palette"></i> 4. Phối màu chủ đạo</label>
            <input type="text" placeholder="VD: Neon Hồng Pastel & Xanh Mint" required>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-file-code"></i> 5. Tên file lưu (Không dùng index.html)</label>
            <input type="text" placeholder="VD: ky-niem.html" required>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-rocket"></i> Tạo Website Ngay
        </button>
    </form>

    <div class="footer">
        Powered by <a href="https://github.com/anhsung986/promptcraft" target="_blank">PromptCraft Engine</a> & GitHub Actions
    </div>
</div>

</body>
</html>
